
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171317">

<title>Rescate de recuerdos ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;

    background:
        radial-gradient(ellipse at 20% 20%, #48232f 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #351b29 0%, transparent 45%),
        #171317;

    color: #f8edeb;
    font-family: Georgia, serif;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

/* FONDO DE CORAZONES */

.hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.heart-bg {
    position: absolute;
    bottom: -60px;
    color: #8f4058;
    opacity: 0;

    text-shadow: 0 0 18px #9e405c;

    animation: flotar linear infinite;
}

@keyframes flotar {
    0% {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
    }

    15% {
        opacity: .20;
    }

    85% {
        opacity: .15;
    }

    100% {
        transform: translateY(-115vh) rotate(35deg) scale(1.2);
        opacity: 0;
    }
}

/* CONTENIDO PRINCIPAL */

.container {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 430px;
    text-align: center;

    animation: aparecer 1.5s ease;
}

.eyebrow {
    color: #d9b9c1;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(34px, 9vw, 47px);
    font-weight: normal;
    line-height: 1.15;
    margin-bottom: 25px;
}

.image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 5px;
    opacity: .85;
    filter: sepia(15%) contrast(95%);
    margin-bottom: 28px;
}

h2 {
    font-size: 23px;
    font-weight: normal;
    line-height: 1.5;
    margin-bottom: 15px;
}

.description {
    color: #c9b9bd;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 32px;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 40px;

    background: #e9d5d9;
    color: #34252b;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #f4e4e7;
    box-shadow: 0 0 25px rgba(217, 170, 183, .2);
    transform: translateY(-2px);
}

button:active {
    transform: scale(.96);
}

.footer {
    color: #a99aa0;
    font-family: Arial, sans-serif;
    font-size: 11px;
    margin-top: 30px;
    letter-spacing: 1px;
}

.heart {
    color: #d9aab7;
}

/* ANIMACIÓN DE ENTRADA */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<!-- CORAZONES ANIMADOS -->

<div class="hearts">

    <span class="heart-bg"
        style="left:8%;font-size:22px;animation-duration:16s;">
        ♥
    </span>

    <span class="heart-bg"
        style="left:22%;font-size:14px;animation-duration:20s;animation-delay:3s;">
        ♡
    </span>

    <span class="heart-bg"
        style="left:38%;font-size:28px;animation-duration:18s;animation-delay:7s;">
        ♥
    </span>

    <span class="heart-bg"
        style="left:57%;font-size:17px;animation-duration:22s;animation-delay:2s;">
        ♡
    </span>

    <span class="heart-bg"
        style="left:73%;font-size:25px;animation-duration:19s;animation-delay:5s;">
        ♥
    </span>

    <span class="heart-bg"
        style="left:91%;font-size:16px;animation-duration:21s;animation-delay:9s;">
        ♡
    </span>

</div>

<!-- PÁGINA DE BIENVENIDA -->

<main class="container">

    <div class="eyebrow">
        UN PEQUEÑO UNIVERSO PARA TI
    </div>

    <h1>
        Rescate de<br>recuerdos
    </h1>

    <img
        class="image"
        src="assets/recuerdo-portada.jpg"
        alt="Un recuerdo esperando ser descubierto"
    >

    <h2>
        Hay historias que merecen ser recordadas.
    </h2>

    <p class="description">
        Algunos recuerdos esperan ser encontrados.
        Otros todavía tienen algo que contarte.

        <br><br>

        Este pequeño universo guarda una historia
        que quiero compartir contigo.
    </p>

    <button onclick="comenzar()">
        Descubrir mi regalo ♡
    </button>

    <div class="footer">
        HECHO CON AMOR, PARA TI
        <span class="heart">♥</span>
    </div>

</main>

<script>
function comenzar() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
